  {id:"receiving",name:"Receiving",icon:"🤲",color:"#0ea5e9",skills:[

    {id:"soft_hands",name:"Soft Hands",level:1,why:"A rigid stick causes the ball to rebound. Soft hands absorbs pace and kills the ball dead.",test:"Feeder hits firm passes from 10m. Give with the stick on contact. Ball must stop within 50cm. 10 attempts.",testType:"outcomes",attempts:10,outcomes:[{label:"Absorbed within 50cm",pts:10,color:GR,icon:"✅"},{label:"Stopped within 1m",pts:5,color:OR,icon:"⚠️"},{label:"Rebounded away",pts:0,color:RD,icon:"❌"}],criteria:["4/10 absorbed","6/10 within 50cm","7–8/10 ball stays close","9/10 ball dies on stick","All 10 regardless of incoming pace"]},

  {id:"passing",name:"Passing",icon:"🏒",color:"#3b82f6",skills:[

function grade(s){
  if(s>=80)return{g:"A",l:"Excellent",c:GR};
  if(s>=60)return{g:"B",l:"Good",c:"#3b82f6"};
  if(s>=40)return{g:"C",l:"Developing",c:OR};
  return{g:"D",l:"Foundation",c:RD};
}
function toStars(s){return Math.min(5,Math.max(0,Math.round((s/100)*5)));}

function Stars({sc,sm}){
  const n=toStars(sc||0);
  return h("div",{style:{display:"flex",gap:2}},
    [1,2,3,4,5].map(i=>h("span",{key:i,style:{fontSize:sm?12:17,color:i<=n?Y:"#ccc",textShadow:i<=n?"0 0 4px rgba(245,197,0,0.5)":"none"}},"★"))
  );
}

function Bar({sc,color,hh}){
  const height=hh||7;

function Spark({id,hist}){
  const data=(hist[id]||[]);

  const W=150,H=36;

    h("svg",{width:W,height:H},
      h("polyline",{points:pts,fill:"none",stroke:BL,strokeWidth:2,strokeLinejoin:"round"}),
